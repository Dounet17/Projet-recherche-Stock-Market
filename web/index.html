<style>
/* Concept : un relevé de compte de recherche. Une règle graduée en dollars, présente sur chaque vue,
   situe toutes les stratégies sur le même axe. Le fond reste calme, la couleur est réservée aux données. */
:root {
  --ground: #f1f3f7; --surface: #fbfcfd; --ink: #141a2b; --ink-2: #454d63; --ink-3: #5c6480;
  --hair: #d9dde7; --axis: #b6bccc; --accent-wash: #e3e7fb;
  --accent: #3346d3; --hold: #d9641e; --third: #0f8f7e; --neutral-mark: #a2a9bb;
  --pos: #3346d3; --neg: #cf4a2d; --mid: #eceef3;
  --good: #0b7a57; --warn: #a86a00; --todo: #5c6480;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --step-1: .8125rem; --step0: 1rem; --step1: 1.1875rem; --step2: 1.5rem; --step3: clamp(1.9rem, 1.3rem + 2.6vw, 3.1rem);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #10131c; --surface: #171b27; --ink: #e9ecf4; --ink-2: #bcc2d2; --ink-3: #979eb3;
  --hair: #2a3040; --axis: #414860; --accent-wash: #232a4c;
  --accent: #7787ee; --hold: #d57732; --third: #27a892; --neutral-mark: #636b82;
  --pos: #7787ee; --neg: #e0694c; --mid: #262b3a;
  --good: #3cc196; --warn: #e3a53b; --todo: #979eb3; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ground: #10131c; --surface: #171b27; --ink: #e9ecf4; --ink-2: #bcc2d2; --ink-3: #979eb3;
  --hair: #2a3040; --axis: #414860; --accent-wash: #232a4c;
  --accent: #7787ee; --hold: #d57732; --third: #27a892; --neutral-mark: #636b82;
  --pos: #7787ee; --neg: #e0694c; --mid: #262b3a;
  --good: #3cc196; --warn: #e3a53b; --todo: #979eb3; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-color: var(--axis) var(--ground); -webkit-text-size-adjust: 100%; }
body { background: var(--ground); color: var(--ink); font: 400 var(--step0)/1.6 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
::selection { background: var(--accent); color: var(--surface); }
a { color: var(--accent); text-underline-offset: .2em; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: var(--step3); font-weight: 720; font-stretch: 108%; letter-spacing: -.022em; max-width: 21ch; }
h2 { font-size: var(--step2); font-weight: 680; font-stretch: 104%; letter-spacing: -.012em; }
h3 { font-size: var(--step1); font-weight: 640; }
p { margin: 0; max-width: 68ch; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin-inline: auto; }

/* Bandeau : nom, règle à capital */
.masthead { background: var(--surface); border-bottom: 1px solid var(--hair); overflow-x: clip; }
.mast-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 24px; padding-top: 16px; }
.brand { font: 720 1.0625rem/1.2 var(--display); font-stretch: 112%; letter-spacing: -.005em; color: var(--ink); text-decoration: none; }
.brand-sub { font-size: var(--step-1); color: var(--ink-3); }
.ruler { position: relative; height: 66px; margin: 8px 0 6px; }
.ruler-caption { font-size: var(--step-1); color: var(--ink-3); padding-bottom: 10px; max-width: none; }
.ruler-line { position: absolute; left: 0; right: 0; top: 34px; height: 1px; background: var(--axis); }
.ruler-grad { position: absolute; top: 30px; width: 1px; height: 9px; background: var(--axis); }
.ruler-num { position: absolute; top: 42px; transform: translateX(-50%); font: 400 .6875rem/1.2 var(--data); color: var(--ink-3); white-space: nowrap; }
.ruler-mark { position: absolute; top: 0; width: 24px; height: 40px; margin-left: -12px; padding: 0; border: 0; background: none; cursor: pointer; }
.ruler-mark::after { content: ""; position: absolute; left: 11px; width: 2px; bottom: 6px; height: var(--h, 16px); border-radius: 2px 2px 0 0; background: var(--c, var(--neutral-mark)); transition: height .15s ease-out; }
.ruler-mark:hover::after, .ruler-mark[aria-current="true"]::after { height: calc(var(--h, 16px) + 7px); }
.ruler-mark[aria-current="true"] { --c: var(--accent); }
.ruler-mark[aria-current="true"]::after { width: 3px; }
.ruler-label { position: absolute; top: 0; transform: translateX(-50%); font: 600 .75rem/1.1 var(--body); color: var(--ink); white-space: nowrap; pointer-events: none; }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--hair); }
.nav ul { display: flex; gap: 2px; list-style: none; margin: 0 auto; padding: 0; overflow-x: auto; scrollbar-width: none; max-width: 1120px; }
.nav a { display: block; padding: 10px 11px; color: var(--ink-2); text-decoration: none; font-size: .9375rem; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }

/* Vues */
main { padding-block: 36px 72px; }
.view { display: grid; gap: 56px; }
.view > section { display: grid; gap: 16px; min-width: 0; }
.opening { display: grid; gap: 14px; }
.lead { font-size: var(--step1); line-height: 1.5; max-width: 62ch; color: var(--ink); }
.note { font-size: .9375rem; color: var(--ink-2); }
.small { font-size: var(--step-1); color: var(--ink-3); }
.takeaways { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.takeaways li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; padding: 14px 0; border-top: 1px solid var(--hair); align-items: baseline; }
.takeaways strong { font: 640 var(--step1)/1.3 var(--display); display: block; margin-bottom: 2px; }
.takeaways a { white-space: nowrap; }
@media (max-width: 620px) { .takeaways li { grid-template-columns: minmax(0, 1fr); } }

/* Figures */
.figure { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.figure-title { font: 620 1.0625rem/1.3 var(--display); }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg text { font-family: var(--data); font-size: 11px; fill: var(--ink-3); }
.chart svg text.direct { font-family: var(--body); font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step-1); color: var(--ink-2); list-style: none; margin: 0; padding: 0; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 3px; border-radius: 2px; background: currentColor; flex: none; }
.swatch.dot { width: 9px; height: 9px; border-radius: 50%; }
.swatch.diamond { width: 9px; height: 9px; border-radius: 1px; transform: rotate(45deg); }
.figure details { font-size: var(--step-1); color: var(--ink-2); }
.figure summary { cursor: pointer; color: var(--ink-3); width: fit-content; padding: 4px 0; }
.scroller { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th { font-weight: 600; text-align: left; color: var(--ink-2); }
th, td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--data); font-variant-numeric: tabular-nums; font-size: .8125rem; padding-left: 10px; padding-right: 0; }
td.wrap-text { white-space: normal; min-width: 18ch; }
tr.is-ref td { font-weight: 600; }
.two .row, .two .axis-row { grid-template-columns: minmax(0, 10.5rem) minmax(0, 1fr); }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }

/* Lignes de valeurs */
.rows { display: grid; gap: 2px; }
.row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; align-items: center; min-height: 30px; width: 100%; padding: 2px 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; border-radius: 6px; }
button.row { cursor: pointer; }
button.row:hover { background: var(--accent-wash); }
button.row[aria-pressed="true"] { background: var(--accent-wash); }
.row-label { font-size: .9375rem; line-height: 1.25; padding-left: 4px; min-width: 0; }
.track { position: relative; height: 24px; min-width: 0; }
.track .bar { position: absolute; top: 8px; height: 8px; background: var(--c, var(--accent)); }
.track .bar.right { border-radius: 0 4px 4px 0; }
.track .bar.left { border-radius: 4px 0 0 4px; }
.track .whisk { position: absolute; top: 11px; height: 2px; background: var(--ink); opacity: .55; }
.track .link { position: absolute; top: 11px; height: 2px; background: var(--axis); }
.track .ref { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.track .ref.strong { width: 2px; background: var(--ink); }
.track .pt { position: absolute; top: 7px; width: 10px; height: 10px; margin-left: -5px; background: var(--c); border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }
.track .pt.diamond { border-radius: 1px; transform: rotate(45deg); }
.track-value { position: absolute; top: 3px; font: 500 .75rem/18px var(--data); color: var(--ink); white-space: nowrap; }
.axis-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; }
.axis-track { position: relative; height: 20px; }
.axis-track span { position: absolute; transform: translateX(-50%); font: 400 .6875rem/20px var(--data); color: var(--ink-3); white-space: nowrap; }
.axis-track span.reflabel { font: 600 .75rem/20px var(--body); color: var(--ink); }
@media (max-width: 620px) {
  .row, .axis-row, .two .row, .two .axis-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .axis-row > :first-child { display: none; }
}

/* Choix */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .875rem/1.2 var(--body); padding: 7px 11px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; cursor: pointer; }
.chip:hover { border-color: var(--axis); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 20px; margin: 0; }
.spec div { display: grid; gap: 1px; }
.spec dt { font-size: var(--step-1); color: var(--ink-3); }
.spec dd { margin: 0; font: 500 var(--step1)/1.3 var(--display); }

/* Termes */
.term { all: unset; cursor: help; border-bottom: 1px dotted var(--ink-3); }
.term:hover { color: var(--accent); border-bottom-color: var(--accent); }
.term:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#tip { position: fixed; z-index: 40; max-width: 300px; padding: 9px 11px; background: var(--ink); color: var(--surface); border-radius: 8px; font-size: var(--step-1); line-height: 1.4; box-shadow: 0 6px 20px rgb(10 14 30 / .24); pointer-events: none; }
#tip b { font-weight: 650; }
#tip table { font-size: var(--step-1); }
#tip td { border: 0; padding: 1px 0; color: inherit; }
#tip td.n { padding-left: 12px; color: inherit; }
#tip .tw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* Calendrier d'une décision */
.day { display: grid; grid-template-columns: 3fr 1.6fr 3fr; gap: 0; }
.day-band { padding: 10px 12px; border-radius: 8px; font-size: .9375rem; line-height: 1.35; }
.day-band.open { background: var(--mid); }
.day-band.night { text-align: center; color: var(--ink-3); font-size: var(--step-1); align-self: center; }
.day-band b { display: block; font: 620 var(--step0)/1.3 var(--display); }
@media (max-width: 620px) { .day { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

/* Heatmap */
.heat td.c { text-align: center; font: 500 .8125rem/1 var(--data); padding: 8px 4px; border: 2px solid var(--surface); border-radius: 6px; min-width: 56px; }
.heat th.c { text-align: center; font-family: var(--data); font-weight: 500; font-size: .75rem; padding-inline: 4px; }

/* Barre segmentée */
.segbar { display: flex; gap: 2px; height: 44px; }
.segbar > div { display: flex; align-items: center; padding-inline: 10px; font: 500 .8125rem/1.15 var(--body); color: #fff; min-width: 0; overflow-wrap: anywhere; }
.segbar > div:first-child { border-radius: 8px 0 0 8px; }
.segbar > div:last-child { border-radius: 0 8px 8px 0; }

/* Explorateur */
.search { display: grid; gap: 6px; max-width: 420px; position: relative; }
.search label { font-weight: 600; font-size: .9375rem; }
.search input { font: inherit; padding: 9px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 8px; width: 100%; }
.suggest { list-style: none; margin: 0; padding: 4px; position: absolute; top: 100%; left: 0; right: 0; z-index: 10; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; box-shadow: 0 8px 24px rgb(10 14 30 / .16); }
.suggest button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest button:hover, .suggest button:focus-visible { background: var(--accent-wash); }
.suggest b { font-family: var(--data); font-weight: 500; margin-right: 8px; }
canvas.scatter { display: block; width: 100%; height: 420px; touch-action: pan-y; }
@media (max-width: 620px) { canvas.scatter { height: 320px; } }

/* État des travaux */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 var(--step-1)/1.2 var(--body); color: var(--c); white-space: nowrap; }
.pill svg { width: 12px; height: 12px; flex: none; }
.running { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--hair); }
.running:first-child { border-top: 0; padding-top: 0; }
.orb { width: 64px; height: 64px; position: relative; }
.orb canvas { width: 100%; height: 100%; display: block; }
.progress { height: 6px; border-radius: 3px; background: var(--mid); overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 0 32px; margin: 0; }
.glossary div { padding: 12px 0; border-top: 1px solid var(--hair); }
.glossary dt { font: 640 var(--step0)/1.3 var(--display); }
.glossary dd { margin: 2px 0 0; color: var(--ink-2); font-size: .9375rem; }
.foot { border-top: 1px solid var(--hair); padding-block: 18px 28px; color: var(--ink-3); font-size: var(--step-1); }
.foot p { max-width: 90ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

function niceTicks(min, max, count = 5) {
  const step0 = (max - min) / count;
  const power = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 5, 10].map((m) => m * power).find((s) => s >= step0);
  const ticks = [];
  for (let t = Math.ceil(min / step) * step; t <= max + step * 1e-6; t += step) ticks.push(Math.round(t / step) * step + 0);
  return ticks;
}

/* Courbes : réticule et info-bulle au survol comme au clavier. */
function lineChart(opts) {
  const node = h("div", { class: "chart" });
  const months = opts.x;
  let hover = null;
  const draw = (width) => {
    node.replaceChildren();
    const height = opts.height || 340;
    const showDirect = width >= 560 && opts.direct !== false;
    const m = { t: 14, r: showDirect ? 150 : 12, b: 24, l: 58 };
    const values = opts.series.flatMap((s) => s.values).filter((v) => v !== null);
    const lo = opts.min ?? Math.min(...values), hi = opts.max ?? Math.max(...values);
    const ticks = niceTicks(lo, hi, opts.ticks || 5);
    const y0 = Math.min(lo, ticks[0]), y1 = Math.max(hi, ticks[ticks.length - 1]);
    const X = (i) => m.l + (i / (months.length - 1)) * (width - m.l - m.r);
    const Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (height - m.t - m.b);
    const svg = S("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img", "aria-label": opts.label, tabindex: 0 });
    ticks.forEach((t) => {
      svg.append(S("line", { x1: m.l, x2: width - m.r, y1: Y(t), y2: Y(t), stroke: css("--hair") }));
      svg.append(S("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, opts.fmt(t)));
    });
    (opts.refs || []).forEach((ref) => {
      svg.append(S("line", { x1: m.l, x2: width - m.r, y1: Y(ref.value), y2: Y(ref.value), stroke: css("--ink-3"), "stroke-width": 1 }));
      if (ref.label) svg.append(S("text", { x: width - m.r - 4, y: Y(ref.value) - 5, "text-anchor": "end" }, ref.label));
    });
    let previous = null;
    months.forEach((date, i) => {
      const year = date.slice(0, 4);
      if (year !== previous) {
        previous = year;
        if (X(i) < width - m.r - 20 && (width >= 460 || +year % 2 === 0)) {
          svg.append(S("line", { x1: X(i), x2: X(i), y1: height - m.b, y2: height - m.b + 4, stroke: css("--axis") }));
          svg.append(S("text", { x: X(i), y: height - 6, "text-anchor": "start" }, year));
        }

    });
    const order = [...opts.series].sort((a, b) => (a.muted ? 0 : 1) - (b.muted ? 0 : 1));
    order.forEach((series) => {
      let d = "", pen = false;
      series.values.forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += `${pen ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`; pen = true;
      });
      svg.append(S("path", { d, fill: "none", stroke: series.color, "stroke-width": series.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });
    if (showDirect) {
      const labels = opts.series.filter((s) => s.direct !== false).map((s) => ({ s, y: Y(s.values[s.values.length - 1]) })).sort((a, b) => a.y - b.y);
      labels.forEach((item, i) => { if (i && item.y - labels[i - 1].y < 16) item.y = labels[i - 1].y + 16; });
      labels.forEach(({ s, y }) => {
        svg.append(S("text", { x: width - m.r + 8, y: y + 4, class: "direct" }, s.short || s.label));
        if (opts.endFmt) svg.append(S("title", {}, opts.endFmt(s.values[s.values.length - 1])));
      });
    }
    const cross = S("line", { y1: m.t, y2: height - m.b, stroke: css("--ink-3"), visibility: "hidden" });
    svg.append(cross);
    const dots = opts.series.map((s) => { const dot = S("circle", { r: 4, fill: s.color, stroke: css("--surface"), "stroke-width": 2, visibility: "hidden" }); svg.append(dot); return dot; });
    const place = (i, clientX, clientY) => {
      hover = i;
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
      opts.series.forEach((s, k) => {
        const v = s.values[i];
        dots[k].setAttribute("visibility", v === null ? "hidden" : "visible");
        if (v !== null) { dots[k].setAttribute("cx", X(i)); dots[k].setAttribute("cy", Y(v)); }
      });
      const rows = opts.series.filter((s) => s.values[i] !== null && !s.quiet).map((s) => [s, s.values[i]]).sort((a, b) => b[1] - a[1]);
      const html = `<b>${opts.dateFmt ? opts.dateFmt(months[i]) : months[i]}</b><table>${rows.map(([s, v]) => `<tr><td><span class="tw" style="background:${s.color}"></span>${esc(s.short || s.label)}</td><td class="n">${opts.fmt(v)}</td></tr>`).join("")}</table>`;
      showTip(html, clientX, clientY);
    };
    const clear = () => { hover = null; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); hideTip(); };
    svg.addEventListener("pointermove", (e) => {
      const box = svg.getBoundingClientRect();
      const px = (e.clientX - box.left) / box.width * width;
      place(clamp(Math.round((px - m.l) / (width - m.l - m.r) * (months.length - 1)), 0, months.length - 1), e.clientX, e.clientY);
    });
    svg.addEventListener("pointerleave", clear);
    svg.addEventListener("blur", clear);
    svg.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      const next = clamp((hover ?? months.length - 1) + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 12 : 1), 0, months.length - 1);
      const box = svg.getBoundingClientRect();
      place(next, box.left + X(next) / width * box.width, box.top + 20);
    });
    node.append(svg);
  };
  return mount(node, draw);
}

/* Lignes horizontales : barres, moustaches, points. Le libellé reste du texte, donc lisible sur téléphone. */
function valueRows(rows, opts) {
  const marks = rows.flatMap((r) => [r.value, r.base, ...(r.range || []), ...(r.points || []).map((p) => p.value)]).filter((v) => v !== undefined && v !== null);
  const lo = opts.min ?? Math.min(0, ...marks), hi = opts.max ?? Math.max(...marks);
  const ticks = opts.ticks || niceTicks(lo, hi, opts.tickCount || 4);
  const x0 = Math.min(lo, ticks[0]), x1 = Math.max(hi, ticks[ticks.length - 1]);
  const P = (v) => ((v - x0) / (x1 - x0)) * 100;
  const refs = opts.refs || [];
  const wrap = h("div", { class: "rows" });
  if (refs.length) {
    wrap.append(h("div", { class: "axis-row", "aria-hidden": "true" }, h("div"), h("div", { class: "axis-track" }, refs.map((ref) => h("span", { class: "reflabel", style: `left:${clamp(P(ref.value), 6, 94)}%` }, ref.label)))));
  }
  rows.forEach((row) => {
    const track = h("div", { class: "track" });
    refs.forEach((ref) => track.append(h("span", { class: "ref" + (ref.strong ? " strong" : ""), style: `left:${P(ref.value)}%` })));
    if (row.value !== undefined && row.value !== null) {
      const origin = row.base ?? opts.base ?? 0;
      const a = P(Math.min(origin, row.value)), b = P(Math.max(origin, row.value));
      track.append(h("span", { class: "bar " + (row.value >= origin ? "right" : "left"), style: `left:${a}%;width:${Math.max(b - a, .4)}%;--c:${row.color || "var(--accent)"}` }));
    }
    if (row.range) track.append(h("span", { class: "whisk", style: `left:${P(row.range[0])}%;width:${Math.max(P(row.range[1]) - P(row.range[0]), .2)}%` }));
    if (row.points) {
      const vals = row.points.map((p) => p.value);
      track.append(h("span", { class: "link", style: `left:${P(Math.min(...vals))}%;width:${P(Math.max(...vals)) - P(Math.min(...vals))}%` }));
      row.points.forEach((p) => track.append(h("span", { class: "pt " + (p.shape || ""), style: `left:${P(p.value)}%;--c:${p.color}` })));
    }
    if (row.tag) {
      const end = Math.max(...[row.value, row.base ?? opts.base, ...(row.range || []), ...(row.points || []).map((p) => p.value)].filter((v) => v !== undefined && v !== null));
      const place = P(end);
      track.append(h("span", { class: "track-value", style: place > 74 ? `right:${100 - place + 1.5}%;background:var(--surface);padding-inline:3px;border-radius:3px` : `left:${place + 1.5}%` }, row.tag));
    }
    const attrs = { class: "row" };
    const tipper = row.tip ? { onpointermove: (e) => showTip(row.tip, e.clientX, e.clientY), onpointerleave: hideTip, onfocus: (e) => { const box = e.target.getBoundingClientRect(); showTip(row.tip, box.left + 20, box.bottom - 6); }, onblur: hideTip } : {};
    const line = row.onclick
      ? h("button", { ...attrs, type: "button", "aria-pressed": row.selected ? "true" : "false", onclick: row.onclick, ...tipper }, h("span", { class: "row-label" }, row.label), track)
      : h("div", { ...attrs, ...tipper }, h("span", { class: "row-label" }, row.label), track);
    wrap.append(line);
  });

  return wrap;
}

/* Colonnes, simples ou groupées, avec valeurs négatives. */
function columns(opts) {
  const node = h("div", { class: "chart" });
  const draw = (width) => {
    node.replaceChildren();
    const height = opts.height || 280;
    const m = { t: 12, r: 6, b: opts.labelHeight || 26, l: 50 };
    const all = opts.rows.flatMap((r) => r.values.map((v) => v.value));
    const low = Math.min(0, ...all), high = Math.max(0, ...all);
    const inner = niceTicks(low, high, opts.tickCount || 4);
    const gap = inner.length > 1 ? inner[1] - inner[0] : Math.abs(high - low) || 1;
    const ticks = [...inner];
    if (ticks[0] > low + gap * 1e-6) ticks.unshift(ticks[0] - gap);
    if (ticks[ticks.length - 1] < high - gap * 1e-6) ticks.push(ticks[ticks.length - 1] + gap);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (height - m.t - m.b);
    const band = (width - m.l - m.r) / opts.rows.length;
    const svg = S("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img", "aria-label": opts.label });
    ticks.forEach((t) => {
      svg.append(S("line", { x1: m.l, x2: width - m.r, y1: Y(t), y2: Y(t), stroke: t === 0 ? css("--axis") : css("--hair") }));
      svg.append(S("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, opts.fmt(t)));
    });
    opts.rows.forEach((row, i) => {
      const n = row.values.length;
      const group = Math.min(band * .72, n * 44);
      const barWidth = Math.max(3, (group - 2 * (n - 1)) / n);
      const left = m.l + band * i + (band - group) / 2;
      row.values.forEach((value, k) => {
        const x = left + k * (barWidth + 2);
        const top = Y(Math.max(value.value, 0)), bottom = Y(Math.min(value.value, 0));
        const r = Math.min(4, barWidth / 2);
        const d = value.value >= 0
          ? `M${x} ${bottom}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + barWidth - r}Q${x + barWidth} ${top} ${x + barWidth} ${top + r}V${bottom}Z`
          : `M${x} ${top}V${bottom - r}Q${x} ${bottom} ${x + r} ${bottom}H${x + barWidth - r}Q${x + barWidth} ${bottom} ${x + barWidth} ${bottom - r}V${top}Z`;
        const path = S("path", { d, fill: value.color });
        const hit = S("rect", { x: x - 1, y: m.t, width: Math.max(barWidth + 2, 24), height: height - m.t - m.b, fill: "transparent" });
        const html = value.tip || `<b>${esc(row.label)}</b><br>${esc(value.name ? value.name + " : " : "")}${opts.fmt(value.value)}`;
        hit.addEventListener("pointermove", (e) => showTip(html, e.clientX, e.clientY));
        hit.addEventListener("pointerleave", hideTip);
        svg.append(path, hit);
      });
      const show = opts.labelEvery ? (i % opts.labelEvery === 0) : width > opts.rows.length * 34 || i % 2 === 0;
      if (show) svg.append(S("text", { x: m.l + band * i + band / 2, y: height - 8, "text-anchor": "middle" }, width < 520 && row.shortLabel ? row.shortLabel : row.label));
    });
    node.append(svg);
  };
  return mount(node, draw);
}

/* Règle à capital */
function buildRuler() {

  });
  const fixed = [{ v: D.spy.final, label: "SPY", c: "var(--ink)" }, { v: SERIES.qqq.capital.at(-1), label: "QQQ", c: "var(--ink)" }, { v: SERIES.buyhold.capital.at(-1), label: "Action moyenne", c: "var(--hold)" }];
  fixed.forEach((f) => {

  });
  const heights = { rsi2: 24, ml: 18, bollinger: 12 };
  D.strategies.forEach((s) => {
    root.append(h("button", { type: "button", class: "ruler-mark", "aria-label": `${s.label} : ${usd(s.final)}. Voir le détail.`, "data-final": s.final, "data-id": s.id, "aria-current": s.id === state.strategy ? "true" : "false", style: `left:${P(s.final)}%;--h:${heights[s.id] || 14}px`, onclick: () => { state.strategy = s.id; syncStrategy(); location.hash = "strategies"; }, onpointermove: (e) => showTip(`<b>${esc(s.label)}</b><br>${usd(s.final)} après frais`, e.clientX, e.clientY), onpointerleave: hideTip, onfocus: (e) => { const box = e.target.getBoundingClientRect(); showTip(`<b>${esc(s.label)}</b><br>${usd(s.final)} après frais`, box.left, box.bottom); }, onblur: hideTip }));

function buildExplorer() {
  const stocks = D.stocks;
  const bySymbol = new Map(stocks.map((s) => [s[0], s]));
  const result = h("div", { style: "display:grid;gap:12px" });
  const input = h("input", { id: "stock-search", type: "search", autocomplete: "off", value: state.stock, placeholder: "TSLA, Apple, SIVB...", "aria-describedby": "stock-help" });
  const suggest = h("ul", { class: "suggest", hidden: true });
  const canvas = h("canvas", { class: "scatter", role: "img", "aria-label": "Chaque point est une action : capital en la gardant en abscisse, capital avec la règle en ordonnée" });
  const SPY_X = D.spy.final / D.capital;
  const paintCache = { W: 0, H: 0, pts: [] };

  function drawScatter() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    const c = canvas.getContext("2d");
    c.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const m = { t: 12, r: 24, b: 38, l: 66 };
    const lo = Math.log10(.03), hi = Math.log10(100);
    const X = (v) => m.l + (Math.log10(clamp(v, .03, 100)) - lo) / (hi - lo) * (W - m.l - m.r);
    const Y = (v) => H - m.b - (Math.log10(clamp(v, .03, 100)) - lo) / (hi - lo) * (H - m.t - m.b);
    c.font = "11px " + css("--data");
    c.fillStyle = css("--ink-3"); c.strokeStyle = css("--hair"); c.lineWidth = 1;
    [.1, 1, 10, 100].forEach((t) => {
      c.beginPath(); c.moveTo(X(t), m.t); c.lineTo(X(t), H - m.b); c.moveTo(m.l, Y(t)); c.lineTo(W - m.r, Y(t)); c.stroke();
      const text = t === 100 ? "1 M" : nf.format(t * D.capital);
      c.textAlign = "center"; c.fillText(text, X(t), H - m.b + 15);
      c.textAlign = "right"; c.fillText(text, m.l - 6, Y(t) + 4);
    });
    c.textAlign = "center"; c.fillText("Capital en gardant l'action (USD)", (m.l + W - m.r) / 2, H - 6);
    const key = RULE_KEY[state.rule];
    c.fillStyle = css("--accent");
    c.globalAlpha = .3;
    paintCache.pts = stocks.map((s) => { const x = X(Math.max(s[3], .03)), y = Y(Math.max(s[key], .03)); c.beginPath(); c.arc(x, y, 2.1, 0, 7); c.fill(); return [x, y, s]; });
    c.globalAlpha = 1;
    c.strokeStyle = css("--ink"); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(X(.03), Y(.03)); c.lineTo(X(100), Y(100)); c.stroke();
    c.fillStyle = css("--ink"); c.font = "600 12px " + css("--body");
    c.textAlign = "left"; c.fillText("Au-dessus : la règle fait mieux", m.l + 8, m.t + 14);
    c.textAlign = "right"; c.fillText("En dessous : garder fait mieux", W - m.r - 6, H - m.b - 8);
    const chosen = bySymbol.get(state.stock);
    if (chosen) {
      const x = X(Math.max(chosen[3], .03)), y = Y(Math.max(chosen[key], .03));
      c.fillStyle = css("--hold"); c.strokeStyle = css("--surface"); c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill(); c.stroke();
      c.fillStyle = css("--ink"); c.textAlign = x > W - 80 ? "right" : "left";
      c.fillText(chosen[0], x + (x > W - 80 ? -10 : 10), y + 4);
    }
    paintCache.W = W; paintCache.H = H;
  }
  canvas.addEventListener("pointermove", (e) => {
    const box = canvas.getBoundingClientRect();
    const px = e.clientX - box.left, py = e.clientY - box.top;
    let best = null, dist = 400;
    for (const point of paintCache.pts) { const d = (point[0] - px) ** 2 + (point[1] - py) ** 2; if (d < dist) { dist = d; best = point; } }
    if (best) showTip(`<b>${esc(best[2][0])}</b> ${esc(cleanName(best[2][1]))}<br>En gardant : ${usd(best[2][3] * D.capital)}<br>Avec la règle : ${usd(best[2][RULE_KEY[state.rule]] * D.capital)}`, e.clientX, e.clientY); else hideTip();
  });
  canvas.addEventListener("pointerleave", hideTip);
  canvas.addEventListener("click", (e) => {
    const box = canvas.getBoundingClientRect();
    let best = null, dist = 400;
    for (const point of paintCache.pts) { const d = (point[0] - (e.clientX - box.left)) ** 2 + (point[1] - (e.clientY - box.top)) ** 2; if (d < dist) { dist = d; best = point; } }
    if (best) choose(best[2][0]);
  });
  new ResizeObserver(() => drawScatter()).observe(canvas);

  function drawResult() {
    const s = bySymbol.get(state.stock);
    if (!s) { result.replaceChildren(h("p", { class: "note" }, `Aucune action « ${state.stock} » parmi les ${nf.format(stocks.length)} achetables le 2 janvier 2018. Essayez un autre symbole ou un autre nom.`)); return; }
    const rows = [["Garder l'action", s[3], HOLD], ["Moyenne mobile", s[4], ACCENT], ["Bollinger", s[5], ACCENT], ["RSI sur 2 séances", s[6], ACCENT]];
    const top = Math.max(...rows.map((r) => r[1]), SPY_X) * D.capital;
    result.replaceChildren(
      h("p", { html: `<b>${esc(s[0])}</b>, ${esc(cleanName(s[1]) || "nom non identifié")}, ${esc(SECTOR[s[2]] || s[2])}. ${s[7] ? "Cette action a disparu de la cote avant fin 2024 : le résultat inclut l'hypothèse de sortie." : ""}` }),
      valueRows(rows.map(([label, value, color]) => ({ label, value: value * D.capital, color, tag: nf.format(value * D.capital), tip: `<b>${esc(label)}</b><br>${usd(value * D.capital)}` })), { min: 0, max: top * 1.02, fmt: (v) => nf.format(v), refs: [{ value: D.capital, label: "Mise" }, { value: D.spy.final, label: "SPY", strong: true }], tickCount: 4 }));
  }
  function choose(symbol) { state.stock = symbol; input.value = symbol; suggest.hidden = true; drawResult(); drawScatter(); }
  function drawSuggestions() {
    const query = input.value.trim().toLowerCase();
    if (!query || bySymbol.has(input.value.trim().toUpperCase()) && input.value.trim().length < 2) { suggest.hidden = true; return; }
    const hits = stocks.filter((s) => s[0].toLowerCase().startsWith(query)).concat(stocks.filter((s) => !s[0].toLowerCase().startsWith(query) && s[1].toLowerCase().includes(query))).slice(0, 7);
    suggest.replaceChildren(...hits.map((s) => h("li", {}, h("button", { type: "button", onclick: () => choose(s[0]) }, h("b", {}, s[0]), cleanName(s[1])))));
    suggest.hidden = !hits.length;
  }
  input.addEventListener("input", drawSuggestions);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const first = suggest.querySelector("button"); const exact = input.value.trim().toUpperCase(); if (bySymbol.has(exact)) choose(exact); else if (first) first.click(); else { state.stock = exact; drawResult(); } }
    if (e.key === "Escape") suggest.hidden = true;
  });
  drawResult();
  const node = h("section", {}, h("h2", {}, "Et pour une action précise ?"),
    h("p", { id: "stock-help" }, `Cherchez l'une des ${nf.format(stocks.length)} actions achetables en janvier 2018. On y place 10 000 USD et on la suit jusqu'à fin 2024 ou sa disparition, frais compris. Un cas isolé ne prouve rien : le nuage montre l'ensemble.`),
    figure(null, h("div", { class: "search" }, h("label", { for: "stock-search" }, "Action"), input, suggest), result),
    figure("Chaque point est une action, pour la règle choisie", canvas,
      h("p", { class: "small" }, "Axe vertical : capital avec la règle. Échelle logarithmique : chaque graduation multiplie le capital par 10. Les capitaux sous 300 USD sont ramenés sur le bord du graphique.")));
  return { node, redraw: () => drawScatter() };
}

/* Lexique */
function viewGlossary() {
  const list = h("dl", { class: "glossary" });
  const input = h("input", { id: "glossary-search", type: "search", placeholder: "Sharpe, frais, P/E...", autocomplete: "off" });
  const draw = () => {
    const query = input.value.trim().toLowerCase();
    const items = Object.entries(TERMS).filter(([a, b]) => !query || a.toLowerCase().includes(query) || b.toLowerCase().includes(query)).sort(([a], [b]) => a.localeCompare(b, "fr"));
    list.replaceChildren(...items.map(([a, b]) => h("div", {}, h("dt", {}, a.charAt(0).toUpperCase() + a.slice(1)), h("dd", {}, b))));
    if (!items.length) list.replaceChildren(h("p", { class: "note" }, "Aucun terme ne correspond. Essayez un mot plus court."));
  };
  input.addEventListener("input", draw);
  draw();
  return [
    h("section", { class: "opening" }, h("h1", {}, "Lexique"),
      h("p", { class: "lead" }, "Les mots soulignés en pointillés, partout dans le site, affichent leur définition au survol ou au toucher.")),
    h("section", {}, h("div", { class: "search" }, h("label", { for: "glossary-search" }, "Chercher un terme"), input), list),
  ];
}

/* Navigation par ancre, chaque vue construite à sa première ouverture. */

  ["resume", "Résumé", viewResume], ["strategies", "Stratégies", viewStrategies], ["regles", "Règles", viewRules],
  ["marche", "Marché", viewMarket], ["ia", "IA", viewAI], ["evenements", "Événements", viewEvents],
  ["donnees", "Données", viewData], ["suite", "Suite", viewNext], ["lexique", "Lexique", viewGlossary],
];
const built = new Map();
$("#nav").append(...VIEWS.map(([id, label]) => h("li", {}, h("a", { href: "#" + id, "data-view": id }, label))));
function route() {
  const id = VIEWS.some(([key]) => key === location.hash.slice(1)) ? location.hash.slice(1) : "resume";
  document.querySelectorAll("#nav a").forEach((a) => {
    if (a.dataset.view === id) { a.setAttribute("aria-current", "page"); a.scrollIntoView({ block: "nearest", inline: "nearest" }); } else a.removeAttribute("aria-current");
  });
  built.forEach((node) => { node.hidden = true; });
  if (!built.has(id)) {
    const [, , fn] = VIEWS.find(([key]) => key === id);
    const node = h("div", { class: "view" }, fn());
    $("#views").append(node);
    built.set(id, node);
  }
  built.get(id).hidden = false;
  hideTip();
  startOrbs();
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route);
$("#foot").textContent = `Toutes les valeurs : 10 000 USD virtuels, frais déduits, données quotidiennes du 02/01/2018 au 31/12/2024, sauf mention contraire. Ce sont des simulations de recherche, pas des conseils de placement. Reconstruit le ${D.status.builtAt}.`;

/* Orbes : une seule boucle d'animation, arrêtée si la page est masquée. */
const isDark = () => css("--surface").toLowerCase() !== "#fbfcfd";
let orbLoop = 0;
function startOrbs() {
  const engine = window.ORB_ENGINE;
  if (!engine) return;
  const canvases = [...document.querySelectorAll("canvas[data-orb]")].filter((c) => c.offsetParent !== null);
  cancelAnimationFrame(orbLoop);
  if (!canvases.length) return;
  const items = canvases.map((canvas) => {
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = canvas.height = 64 * dpr;
    const preset = engine.resolvePreset(canvas.dataset.orb, 64);
    return { ctx: canvas.getContext("2d"), dpr, preset };
  });
  const frame = (t) => items.forEach(({ ctx, dpr, preset }) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 64, 64);
    engine.paintFrame(ctx, engine.MODE_FRAMES[preset.mode](64, t * preset.speed, preset.opts), isDark());
  });
  if (reduced()) { frame(.6); return; }
  const loop = () => { if (!document.hidden) frame(performance.now() / 1000); orbLoop = requestAnimationFrame(loop); };
  loop();
}
window.addEventListener("orbs-ready", startOrbs);

route();
buildRuler();
